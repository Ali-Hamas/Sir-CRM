version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: britsync-vps-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-shaheerkhanhyd6_db_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-BlackDesk2024!}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-BlackDesk}
    volumes:
      - mongodb_vps_data:/data/db
      - mongodb_vps_config:/data/configdb
    networks:
      - britsync-vps-internal
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: britsync-vps-backend
    restart: always
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL:-mongodb://shaheerkhanhyd6_db_user:BlackDesk2024!@mongodb:27017/BlackDesk?authSource=admin}
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - uploads_vps_data:/app/uploads
    networks:
      - britsync-vps-internal
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health/liveness"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_APP_URL: ${APP_URL:-https://crm.britsyncai.com}
    container_name: britsync-vps-frontend
    restart: always
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - britsync-vps-internal
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

networks:
  britsync-vps-internal:
    driver: bridge

volumes:
  mongodb_vps_data:
  mongodb_vps_config:
  uploads_vps_data:
