version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: blackdesk-mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: shaheerkhanhyd6_db_user
      MONGO_INITDB_ROOT_PASSWORD: BlackDesk2024!
      MONGO_INITDB_DATABASE: BlackDesk
    volumes:
      - mongodb-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: blackdesk-backend
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=mongodb://shaheerkhanhyd6_db_user:BlackDesk2024!@mongodb:27017/BlackDesk?authSource=admin
      - JWT_SECRET=super-secret-key-for-development
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: blackdesk-frontend
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb-data:
